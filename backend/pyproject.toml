[project]
name = "elevenlabs-telco-webhooks"
version = "0.1.0"
description = "Webhook backend for the ElevenLabs telco voice agent: serviceability tool and post-call hook"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.2",
    "httpx>=0.28.1",
]

# Brak [build-system] celowo: to usługa uruchamiana przez `uvicorn app:app`,
# nie biblioteka do zbudowania. pyproject.toml służy tu wyłącznie jako
# deklaracja zależności; lint i formatowanie bierze ruff.toml z korzenia repo.
